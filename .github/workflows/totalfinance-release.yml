# TotalFinance release — the every-public-publish gate, hosted half (Stage 5A, Decision 6).
#
# Dispatched by hand with one input, the exact version being released. Three jobs:
#
#   verify   the whole landing standard on this commit (`pnpm run ci`), then the dry-run packs the
#            fixed group and writes RELEASE_HASHES.json; the manifest is uploaded as the artifact a
#            human approves. Refuses when the input version differs from the packages' version, or the
#            release tag already exists.
#   publish  gated by the `npm-publish` environment (required reviewers). Downloads the approved
#            artifact, re-checks every tarball's sha256 against RELEASE_HASHES.json, and uploads those
#            exact tarballs (`pnpm release:publish`; provenance attested by the OIDC token), then pushes
#            the `totalfinance-v<version>` tag and creates the GitHub release with the changeset notes and
#            the manifest attached. Nothing is re-packed after approval.
#   smoke    installs the group from npmjs.org into a clean directory and runs the consumer journeys
#            against the committed expectations. Blocks the announcement, not the publish.
#
# The library and all release tooling live at this standalone repository's root.

name: TotalFinance release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The exact version being released (must equal every package version at this commit, e.g. 0.1.0-preview.0)'
        required: true
        type: string

permissions:
  contents: read

# Releases never overlap and are never cancelled by a later dispatch.
concurrency:
  group: totalfinance-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: verify ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: require explicit release enablement on main
        env:
          RELEASE_ENABLED: ${{ vars.TOTALFINANCE_RELEASE_ENABLED }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$RELEASE_ENABLED" != true ]; then
            echo "::error::Publishing is disabled. Configure npm ownership and npm-publish reviewers, then explicitly enable TOTALFINANCE_RELEASE_ENABLED and dispatch from main."; exit 2
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      # The release is built on the minimum supported Node: the floor the packages claim.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: refuse a version the tree does not carry, or a tag that already exists
        run: |
          actual="$(node -p "require('./packages/core/package.json').version")"
          if [ "$actual" != "$RELEASE_VERSION" ]; then
            echo "::error::packages are at $actual, not $RELEASE_VERSION — run 'pnpm exec changeset version' and land it first"; exit 2
          fi
          if git ls-remote --tags origin "refs/tags/totalfinance-v$RELEASE_VERSION" | grep -q .; then
            echo "::error::tag totalfinance-v$RELEASE_VERSION already exists; a version is released once"; exit 2
          fi

      - run: pnpm install --frozen-lockfile

      - name: the landing standard, then the dry-run manifest
        run: |
          pnpm run ci
          pnpm release:dry-run --skip-ci --expect-version "$RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: totalfinance-release-${{ inputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish ${{ inputs.version }} (approval required)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The approval gate. Configure the environment with required reviewers; the reviewer opens the
    # `verify` artifact and approves THOSE hashes.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/totalfinance
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: totalfinance-release-${{ inputs.version }}
          path: approved/

      - run: pnpm install --frozen-lockfile

      - name: publish the approved tarballs, unchanged, under the preview dist-tag with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release:publish --dir approved --tag preview

      - name: tag the commit and create the GitHub release with the notes and the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "totalfinance-v$RELEASE_VERSION" -m "TotalFinance $RELEASE_VERSION"
          git push origin "totalfinance-v$RELEASE_VERSION"
          pnpm exec tsx tools/release/changelog-excerpt.ts "$RELEASE_VERSION" > release-notes.md
          gh release create "totalfinance-v$RELEASE_VERSION" \
            --title "TotalFinance $RELEASE_VERSION" \
            --notes-file release-notes.md \
            --prerelease \
            approved/RELEASE_HASHES.json approved/*.tgz

  smoke:
    name: registry smoke ${{ inputs.version }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The registry can take a minute to serve a fresh version to every mirror; retry, bounded.
      - name: install from npmjs.org and run the consumer journeys against the committed expectations
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm release:smoke --version "$RELEASE_VERSION"; then exit 0; fi
            echo "attempt $attempt failed; waiting 60s"; sleep 60
          done
          exit 1

      # Retain the actual installed-package/example evidence for the separately approved public
      # documentation build. A smoke receipt does not itself publish a website or grant a release.
      - uses: actions/upload-artifact@v4
        with:
          name: totalfinance-registry-smoke-${{ inputs.version }}
          path: release/SMOKE_RECEIPT-${{ inputs.version }}.json
          if-no-files-found: error
