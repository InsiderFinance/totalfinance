# Publishes the SDK, then the MCP server that depends on its exact version. Enable only after npm
# trusted publishing and tag protection are configured. Publishing a normal GitHub Release
# authorizes this exact version of both packages to npm latest.
name: TotalFinance release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: totalfinance-release
  cancel-in-progress: false

jobs:
  verify:
    name: verify release source
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: verify published tag, prepared versions, main ancestry and exact full CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TOTALFINANCE_RELEASE_ENABLED: ${{ vars.TOTALFINANCE_RELEASE_ENABLED }}
        run: pnpm exec tsx tools/release/github-sdk-release.ts verify
      - name: full local CI at the release commit
        run: pnpm run ci
      - name: independent API check
        run: pnpm api:check
      - name: independent second coverage pass
        run: pnpm test:coverage
      - name: pack clean-source artifacts without changing versions
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: pnpm release:dry-run --skip-ci --expect-version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: totalfinance-release-${{ steps.source.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish approved SDK and MCP bytes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@insiderfinance/totalfinance
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v4
        with:
          name: totalfinance-release-${{ needs.verify.outputs.version }}
          path: release/approved/
      - run: pnpm install --frozen-lockfile
      - name: publish the SDK, then the MCP server, to latest with OIDC and provenance
        env:
          TOTALFINANCE_RELEASE_ENABLED: ${{ vars.TOTALFINANCE_RELEASE_ENABLED }}
        run: pnpm exec tsx tools/release/github-sdk-release.ts publish --dir release/approved
      - uses: actions/upload-artifact@v4
        with:
          name: totalfinance-publication-${{ needs.verify.outputs.version }}-attempt-${{ github.run_attempt }}
          path: release/approved/RELEASE_PUBLISH_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: verify public SDK and MCP consumers
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      receipt-artifact: totalfinance-smoke-${{ needs.verify.outputs.version }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: totalfinance-release-${{ needs.verify.outputs.version }}
          path: release/approved/
      - name: match SDK and MCP registry bytes and run existing installed-consumer journeys
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm exec tsx tools/release/github-sdk-release.ts smoke --dir release/approved; then exit 0; fi
            echo "Registry smoke attempt $attempt failed; waiting 30s"; sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: totalfinance-smoke-${{ needs.verify.outputs.version }}-attempt-${{ github.run_attempt }}
          path: release/approved/RELEASE_SMOKE_RECEIPT-*.json
          if-no-files-found: error
          retention-days: 30

  docs:
    name: publish the released docs
    needs: smoke
    permissions:
      contents: write
    uses: ./.github/workflows/totalfinance-docs.yml
    with:
      ref: ${{ github.sha }}

  evidence:
    name: attach release evidence to existing GitHub Release
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: totalfinance-release-${{ needs.verify.outputs.version }}
          path: release/approved/
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.smoke.outputs.receipt-artifact }}
          path: release/approved/
      - name: retain approved SDK and MCP bytes and their registry smoke evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: InsiderFinance/totalfinance
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        # No clobber: conflicting preexisting assets require explicit recovery, never replacement.
        run: |
          gh release upload "$RELEASE_TAG" \
            "release/approved/insiderfinance-totalfinance-$RELEASE_VERSION.tgz" \
            "release/approved/insiderfinance-totalfinance-mcp-$RELEASE_VERSION.tgz" \
            release/approved/RELEASE_HASHES.json \
            release/approved/RELEASE_SOURCE.json \
            "release/approved/RELEASE_SMOKE_RECEIPT-$RELEASE_VERSION.json"
