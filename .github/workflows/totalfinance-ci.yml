# TotalFinance CI.
#
# Until this existed, every gate in the library ran only when a human typed `pnpm run ci`. That is 35
# contract-conformance gates, the naming gates, the drift and determinism checks and the packed-consumer
# suite — all of them real, none of them automatic, and a PR could go green in review having never run
# any of them.
#
# It is also why a compiler-version drift went undiagnosed: `typescript` was declared with a caret
# range, so two checkouts installed different patches and disagreed about a generated artifact neither
# had edited. One machine cannot find that. A matrix can.
#
# The matrix is the point, not decoration:
#   22.13.x  the MINIMUM this package claims to support (`engines.node`). A claim nothing tested.
#   24.x     what development happens on.
#   26.x     current, and where the artifact disagreement was first seen.
name: TotalFinance CI

on:
  push:
    branches: [main]
  pull_request:
  # The full matrix once a day as well, so a new Node 24.x/26.x patch release is caught without a push.
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref; the old answer is about code nobody has now.
concurrency:
  group: totalfinance-ci-${{ github.ref }}
  cancel-in-progress: true

# TWO DEPTHS (Trey, 2026-10-06: "right now we're the only users"; revisit before outside contributors).
#
#   pull_request   the fast check: the whole test suite on the MINIMUM supported Node only, five
#                  shards, no coverage, one enforcement generation (TOTALFINANCE_PR_CHECKS), plus
#                  the static checks, the clean-checkout regeneration and the release rehearsal.
#   main, daily,   the full gate: every supported Node, coverage with its floor, and the
#   manual         enforcement generator's determinism check.
#
# A red `main` is fixed before anything else merges.

jobs:
  # Everything `pnpm run ci` runs, split across five machines per Node version.
  #
  # One job per version ran the whole suite on a 4-core runner at `maxWorkers: '50%'` — two test
  # workers — and took 19–39 minutes (2026-10-06). Raising the worker count on that one machine would
  # bring back the CPU and memory oversubscription `vitest.config.ts` caps it against (WS1.16), so the
  # parallelism comes from more machines instead: each version's test files are sharded five ways,
  # balanced by measured duration, and every shard runs on its own runner with the same two workers.
  #
  # The non-test steps of `pnpm run ci` run once per version in `static`, in parallel with the shards,
  # so no shard waits on them. Coverage is collected per shard and its floor enforced once per version
  # in `coverage`, over the merged blobs (see `vitest.config.ts`).
  ci:
    name: ci (node ${{ matrix.node }}, shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    # `tools/manifest/enforcement-regeneration.test.ts` generates the enforcement record in child
    # processes: one on a pull request, two started together on the full gate. One generation is ~75s
    # of real library calls on the development machine (2026-10-06). This is headroom rather than a
    # target — and it is the real backstop for a hung run, which is why the in-test budgets do not need
    # to be tight.
    timeout-minutes: 60
    strategy:
      # Every version reports. Stopping at the first failure hides whether a break is universal or
      # version-specific, which is the single most useful thing a matrix can tell you.
      fail-fast: false
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && '["22.13.0"]' || '["22.13.0", "24.x", "26.x"]') }}
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Taken from `packageManager` in package.json rather than pinned again here, so the
          # two cannot disagree.
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # `--frozen-lockfile` is load-bearing: it is what makes the TypeScript pin actually hold. An
      # install that may resolve a newer patch is an install that may rewrite a generated artifact.
      - run: pnpm install --frozen-lockfile

      # Every shard builds: tests read the built distribution and the site.
      - run: pnpm build && pnpm site:build

      # This shard's share of the test files. `tools/packed-consumer.test.ts` packs real tarballs,
      # installs them, and imports them as ESM, CJS, through esbuild and under strict TypeScript
      # resolution, so the published-consumer experience is covered here rather than in a separate job.
      # No NODE_OPTIONS here on purpose. The conformance suite's heap requirement is declared in
      # `vitest.config.ts` (`poolOptions.*.execArgv`) and in the child processes it spawns, where it
      # reaches the processes that need it. Setting it here as well would make CI pass where a
      # contributor's `pnpm run ci` fails, which is how a reviewer once hit it.
      - name: tests (shard ${{ matrix.shard }} of 5)
        env:
          TOTALFINANCE_COVERAGE_SHARD: '1'
          TOTALFINANCE_PR_CHECKS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: >-
          pnpm exec vitest run ${{ github.event_name == 'pull_request' && ' ' || '--coverage' }}
          --reporter=default --reporter=blob --shard=${{ matrix.shard }}/5

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          name: vitest-blob-node-${{ matrix.node }}-shard-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}-5.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # The rest of `pnpm run ci` — format, lint, typecheck, the site's own tests and the API report — once
  # per version, beside the shards rather than in front of one. About four minutes, shorter than any
  # shard, so it never sets the wall time.
  static:
    name: static checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && '["22.13.0"]' || '["22.13.0", "24.x", "26.x"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm site:typecheck

      # The site tests and the API report read the build.
      - run: pnpm build && pnpm site:build

      - run: pnpm site:test && pnpm api:check

  # The coverage floor, once per version, over the merged shards. Merging reproduces the unsharded
  # totals exactly (measured 2026-10-06), and it reports every shard's test results again, so a
  # failed shard fails here too.
  coverage:
    name: coverage (node ${{ matrix.node }})
    needs: ci
    # The full gate only: pull requests run without coverage (see TWO DEPTHS above).
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-node-${{ matrix.node }}-shard-*
          path: .vitest-reports
          merge-multiple: true

      # The download pattern alone does not prove completeness: Vitest will merge a partial set.
      - name: verify every coverage shard arrived
        run: pnpm exec tsx tools/test-support/verify-coverage-reports.ts .vitest-reports 5

      - run: pnpm exec vitest run --merge-reports --coverage

  # The release rehearsal (Stage 5A, Decision 9): the dry-run packs the fixed group and writes the hash
  # manifest, the tarballs are published into a Verdaccio started in this job, and the registry smoke
  # installs them back from that registry and runs the consumer journeys against the committed
  # expectations. It proves the publish tooling on every push, so the first time it meets npmjs.org is
  # not the first time it runs. The @insiderfinance scope has no uplink in the rehearsal config: a package the
  # dry-run forgot cannot be filled in from the real registry.
  release-rehearsal:
    name: release rehearsal (local registry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: dry-run — pack the two public distributions and write the hash manifest
        run: pnpm release:dry-run --skip-ci

      - name: start a local registry
        run: |
          mkdir -p release
          (pnpm dlx verdaccio@6 --config tools/release/verdaccio.yaml --listen 4873 > release/verdaccio.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4873/-/ping > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "::error::verdaccio did not start"; cat release/verdaccio.log; exit 1

      - name: publish the tarballs into the local registry (provenance off — a loopback registry cannot attest)
        run: pnpm release:publish --registry http://localhost:4873

      - name: registry smoke — install from the local registry and run the consumer journeys
        run: pnpm release:smoke --version "$(node -p "require('./distribution/totalfinance/package.json').version")" --registry http://localhost:4873 --approved release

  # Clean-repository generation (Stage 4.7, FC9 Decision 9): the whole regeneration chain runs in its
  # lawful order on a clean checkout and the job fails if any generated artifact — the signature and
  # naming inventories, the contracts, the enforcement record, the validation specs, the API reports,
  # the READMEs, llms.txt, the bundle report, the OpenAPI document, the docs inventory, the field
  # reference — comes out different from what is committed. A generated file that drifts from its
  # declarations cannot land unnoticed.
  regen-check:
    name: clean-repository generation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm regen:check
      # Retain the actual evidence before the ephemeral runner disappears. A filename alone cannot
      # explain a platform-specific drift in numerical diagnostics or measured return values.
      - name: Show regeneration differences
        if: failure()
        run: |
          git diff --no-ext-diff --stat
          git diff --no-ext-diff -- tools/manifest/public-enforcement.json
